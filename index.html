<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>流水线拼豆 · Phase-1 演示</title>

<!-- React 经 CDN 加载(Babel 解析内联 JSX,演示用) -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg-0:#0c0f14;
    --bg-1:#12171f;
    --panel:#151b25;
    --panel-2:#1b2330;
    --line:#263142;
    --ink:#e9edf3;
    --ink-dim:#9aa7b8;
    --ink-faint:#64748b;
    --amber:#ffb347;
    --coral:#ff6b5e;
    --teal:#2dd4bf;
    --grad:linear-gradient(120deg,var(--coral),var(--amber) 45%,var(--teal));
    --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Space Grotesk",system-ui,sans-serif;
    color:var(--ink);
    background:var(--bg-0);
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .atmos{position:fixed;inset:0;z-index:-2;
    background:
      radial-gradient(60% 55% at 82% -8%, rgba(255,107,94,.20), transparent 60%),
      radial-gradient(55% 50% at 6% 8%, rgba(45,212,191,.16), transparent 60%),
      radial-gradient(70% 60% at 50% 110%, rgba(255,179,71,.12), transparent 60%),
      var(--bg-0);
  }
  .dots{position:fixed;inset:0;z-index:-1;opacity:.45;
    background-image:radial-gradient(rgba(255,255,255,.09) 1px, transparent 1px);
    background-size:22px 22px;}
  .wrap{max-width:1080px;margin:0 auto;padding:32px 20px 80px}

  header.masthead{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;
    padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:26px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{width:46px;height:46px;border-radius:13px;background:var(--grad);
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
    padding:6px;gap:3px;box-shadow:0 8px 26px rgba(255,107,94,.35)}
  .logo i{border-radius:3px;background:#0c0f14}
  .logo i:nth-child(3n+1){background:var(--teal)}
  .logo i:nth-child(3n){background:var(--amber)}
  .logo i:nth-child(even){background:var(--coral)}
  h1{font-family:"Syne",sans-serif;font-weight:800;font-size:clamp(26px,4vw,40px);
    line-height:1.02;margin:0;letter-spacing:-.02em}
  h1 .accent{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sub{color:var(--ink-dim);font-size:14.5px;margin:6px 0 0;max-width:560px}
  .badge{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:12px;
    color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:6px 12px;
    background:var(--panel)}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}}

  .card{background:linear-gradient(180deg,var(--panel),var(--bg-1));
    border:1px solid var(--line);border-radius:var(--radius);padding:20px}
  .card h2{font-family:"Syne";font-weight:700;font-size:17px;margin:0 0 14px;display:flex;align-items:center;gap:9px}
  .card h2 .n{font-family:"IBM Plex Mono";font-size:12px;color:var(--ink-faint);
    border:1px solid var(--line);border-radius:7px;padding:2px 7px}

  .drop{border:1.5px dashed var(--line);border-radius:14px;padding:26px 18px;text-align:center;
    transition:.18s ease;cursor:pointer;background:var(--bg-1)}
  .drop:hover,.drop.focus{border-color:var(--amber);background:rgba(255,179,71,.06);transform:translateY(-1px)}
  .drop p{margin:8px 0 0;color:var(--ink-dim);font-size:14px}
  .drop .big{font-family:"Syne";font-weight:800;font-size:16px;color:var(--ink)}
  .drop input{display:none}
  .thumb{margin-top:14px}
  .thumb img{max-width:100%;max-height:220px;border-radius:12px;border:1px solid var(--line);background:#000}

  .opts{display:flex;flex-direction:column;gap:18px}
  .optlabel{font-size:12px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.12em;font-weight:600}
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .seg button{font-family:"Space Grotesk";font-weight:600;font-size:14px;
    color:var(--ink-dim);background:var(--bg-1);border:1px solid var(--line);
    border-radius:11px;padding:10px 15px;cursor:pointer;transition:.15s}
  .seg button:hover{border-color:var(--ink-faint)}
  .seg button.active{color:#0c0f14;background:var(--grad);border-color:transparent;font-weight:700}

  .run{margin-top:6px;width:100%;font-family:"Syne";font-weight:800;font-size:17px;
    color:#0c0f14;border:none;border-radius:13px;padding:15px;cursor:pointer;
    background:var(--grad);box-shadow:0 10px 30px rgba(45,212,191,.22);transition:.16s;
    display:flex;align-items:center;justify-content:center;gap:10px}
  .run:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 14px 36px rgba(255,107,94,.32)}
  .run:disabled{opacity:.55;cursor:not-allowed}

  .progress{margin-top:16px;display:none}
  .progress.show{display:block;animation:fade .3s ease}
  .pbar{height:9px;border-radius:999px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}
  .pfill{height:100%;width:0%;background:var(--grad);border-radius:999px;transition:width .3s ease}
  .ptxt{margin-top:8px;font-family:"IBM Plex Mono";font-size:12px;color:var(--ink-dim);display:flex;justify-content:space-between}
  .spin{width:14px;height:14px;border:2.5px solid rgba(12,15,20,.3);border-top-color:var(--coral);
    border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block}

  .results{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
  @media(max-width:820px){.results{grid-template-columns:1fr}}
  .reveal{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
  .reveal:nth-child(2){animation-delay:.07s}
  .gridframe{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#000;
    display:flex;justify-content:center;padding:12px}
  .gridframe img{max-width:100%;height:auto;border-radius:6px}
  .gridcap{font-family:"IBM Plex Mono";font-size:12px;color:var(--ink-faint);margin-top:10px;text-align:center}

  .actions{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .btn{font-family:"Space Grotesk";font-weight:600;font-size:14px;border-radius:11px;padding:11px 16px;cursor:pointer;transition:.15s;border:1px solid var(--line)}
  .btn.primary{color:#0c0f14;background:var(--grad);border-color:transparent;font-weight:700;box-shadow:0 8px 24px rgba(255,179,71,.25)}
  .btn.primary:hover{transform:translateY(-1px)}
  .btn.ghost{background:var(--bg-1);color:var(--ink)}
  .btn.ghost:hover{border-color:var(--ink-faint)}

  .statrow{display:flex;gap:12px;margin-bottom:14px}
  .stat{flex:1;background:var(--bg-1);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .stat .k{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.1em}
  .stat .v{font-family:"Syne";font-weight:800;font-size:22px;margin-top:3px}
  .stat .v small{font-size:12px;color:var(--ink-dim);font-family:"IBM Plex Mono";font-weight:400}

  table.bom{width:100%;border-collapse:collapse;font-size:13.5px}
  table.bom th{text-align:left;color:var(--ink-faint);font-weight:600;font-size:11px;
    text-transform:uppercase;letter-spacing:.08em;padding:8px 8px;border-bottom:1px solid var(--line)}
  table.bom td{padding:9px 8px;border-bottom:1px solid rgba(38,49,66,.5)}
  table.bom tr:last-child td{border-bottom:none}
  table.bom .cnt{text-align:right;font-family:"IBM Plex Mono";font-weight:500}
  .swatch{width:18px;height:18px;border-radius:5px;display:inline-block;vertical-align:-2px;
    margin-right:9px;border:1px solid rgba(255,255,255,.18)}
  .namecol{display:flex;align-items:center}
  .nm{font-weight:500}
  .idc{font-family:"IBM Plex Mono";color:var(--ink-faint);font-size:11px}
  .pct{font-family:"IBM Plex Mono";color:var(--ink-dim);font-size:12px}
  .empty{color:var(--ink-faint);font-size:13px;padding:14px;text-align:center;border:1px dashed var(--line);border-radius:12px}

  .err{margin-top:16px;background:rgba(255,107,94,.10);border:1px solid rgba(255,107,94,.5);
    color:#ffd7d0;border-radius:12px;padding:12px 14px;font-size:13.5px;display:none}
  .err.show{display:block;animation:fade .3s ease}

  footer{margin-top:40px;color:var(--ink-faint);font-size:12.5px;font-family:"IBM Plex Mono";text-align:center;line-height:1.7}
  footer code{color:var(--teal)}

  @keyframes sp{to{transform:rotate(360deg)}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="atmos"></div><div class="dots"></div>
<div id="root"></div>

<script type="text/babel">
const {useState, useEffect} = React;

function toB64(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => {
      const s = r.result;
      const i = s.indexOf(',');
      resolve(i >= 0 ? s.slice(i+1) : s);
    };
    r.onerror = () => reject(r.error);
    r.readAsDataURL(file);
  });
}

function downloadBlob(b64, filename, mime){
  const raw = atob(b64);
  const bytes = new Uint8Array(raw.length);
  for (let k=0;k<raw.length;k++) bytes[k]=raw.charCodeAt(k);
  const blob = new Blob([bytes], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function App(){
  const [cfg, setCfg] = useState(null);
  const [file, setFile] = useState(null);
  const [thumb, setThumb] = useState(null);
  const [size, setSize] = useState(32);
  const [bead, setBead] = useState('circle');
  const [status, setStatus] = useState('idle');
  const [error, setError] = useState('');
  const [pct, setPct] = useState(0);
  const [result, setResult] = useState(null);

  // 尺寸/形状/定价均由后端 /api/config 驱动,缺省值兜底
  useEffect(function(){
    fetch('/api/config').then(function(r){return r.json();})
      .then(function(d){setCfg(d);})
      .catch(function(){setCfg(null);});
  }, []);

  var sizes = (cfg && cfg.sizes) ? cfg.sizes : [16, 32, 50];
  var beads = (cfg && cfg.beads) ? cfg.beads : [{v:'circle', l:'圆豆'}, {v:'square', l:'方豆'}];
  var pricing = (cfg && cfg.pricing) ? cfg.pricing :
    {16:{limit:'256 颗', price:9.9}, 32:{limit:'1,024 颗', price:19.9}, 50:{limit:'2,500 颗', price:39.9}};
  var price = pricing[String(size)] ? pricing[String(size)].price : (size===16?9.9:(size===32?19.9:39.9));

  const pick = (f) => {
    if (!f || !f.type.startsWith('image')) return;
    setFile(f);
    const u = URL.createObjectURL(f);
    setThumb(u);
    setError('');
  };

  const onDrop = (e) => {
    e.preventDefault();
    e.currentTarget.classList.remove('focus');
    if (e.dataTransfer.files && e.dataTransfer.files[0]) pick(e.dataTransfer.files[0]);
  };

  const run = async () => {
    if (!file) return;
    setStatus('processing');
    setError('');
    setResult(null);
    setPct(0);
    let p = 6;
    const timer = setInterval(() => {
      p = Math.min(p + Math.random()*14, 92);
      setPct(p);
    }, 260);
    try{
      const b64 = await toB64(file);
      const res = await fetch('/api/process', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({image_b64:b64, size, bead}),
      });
      const data = await res.json();
      clearInterval(timer);
      if(!res.ok || data.error){
        setError(data.error || ('HTTP '+res.status));
        setStatus('error'); setPct(0); return;
      }
      setPct(100);
      setResult(data);
      setStatus('done');
      setTimeout(function(){var el=document.getElementById('result-anchor'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'});},80);
    }catch(err){
      clearInterval(timer);
      setError('请求失败:'+err.message);
      setStatus('error'); setPct(0);
    }
  };

  const total = result ? result.bom.reduce((s,x)=>s+x.count,0) : 0;
  const sorted = result ? [].concat(result.bom).sort((a,b)=>b.count-a.count) : [];

  return (
    <div className="wrap">
      <header className="masthead">
        <div className="brand">
          <div className="logo"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div>
            <h1>流水线拼豆 <span className="accent">· Phase-1</span></h1>
            <p className="sub">上传一张照片 -> 后端 CV 自动量化 -> 生成标准 BOM 与拼豆图纸(PDF)。第一阶段纯软件验证,图片->像素色卡->清单。</p>
          </div>
        </div>
        <div className="badge">React + Canvas · Python CV · 可配置定价</div>
      </header>

      <div className="grid2">
        <div className="card">
          <h2><span className="n">01</span> 上传图片</h2>
          <label className={"drop"+(file?' focus':'')}
             onDragOver={function(e){e.preventDefault();e.currentTarget.classList.add('focus');}}
             onDragLeave={function(e){e.currentTarget.classList.remove('focus');}}
             onDrop={onDrop}>
            <input type="file" accept="image/*"
               onChange={function(e){pick(e.target.files[0]);}} />
            {file
              ? <div className="thumb"><img src={thumb} alt="预览" /></div>
              : <><div className="big">点击选择 或 拖图到这里</div>
                 <p>任意 JPG/PNG,建议正方形裁切效果更佳</p></>}
          </label>

          <div className="opts" style={{marginTop:18}}>
            <div>
              <div className="optlabel">图纸尺寸(像素边长)</div>
              <div className="seg">
                {sizes.map(function(s){return <button key={s} className={s===size?'active':''} onClick={function(){setSize(s);}}>{s}x{s}</button>;})}
              </div>
            </div>
            <div>
              <div className="optlabel">豆子形状</div>
              <div className="seg">
                {beads.map(function(b){return <button key={b.v} className={b.v===bead?'active':''} onClick={function(){setBead(b.v);}}>{b.l}</button>;})}
              </div>
            </div>
          </div>

          <button className="run" disabled={!file||status==='processing'} onClick={run}>
            {status==='processing' ? <><span className="spin"></span> 处理中…</>
              : '▶ 生成图纸 & BOM'}
          </button>

          <div className={"progress"+(status==='processing'?' show':'')}>
            <div className="pbar"><div className="pfill" style={{width:pct+'%'}}></div></div>
            <div className="ptxt"><span>CV 量化 · K-Means 预降色 · CIELAB 匹配</span><span>{Math.round(pct)}%</span></div>
          </div>

          <div className={"err"+(status==='error'?' show':'')}>{error}</div>
        </div>

        <div className="card">
          <h2><span className="n">02</span> 阶梯定价</h2>
          <table className="bom">
            <thead><tr><th>图纸尺寸</th><th>豆子总数上限</th><th>单价</th></tr></thead>
            <tbody>
              {Object.keys(pricing).sort(function(a,b){return Number(a)-Number(b);}).map(function(s){
                var p = pricing[s];
                return <tr key={s}><td>{s}x{s}</td><td>{p.limit}</td><td>¥ {p.price}</td></tr>;
              })}
            </tbody>
          </table>
          <p style={{color:'var(--ink-dim)',fontSize:13,marginTop:14,lineHeight:1.7}}>
            价格为演示配置值,可在后端 <code style={{color:'var(--teal)'}}>server.py</code> 的
            <code style={{color:'var(--teal)'}}> PRICING</code> 中直接修改;实际颗数以 BOM 精确清单为准。
            生成后下方会显示像素预览与色卡清单,并可一键导出 PDF 图纸供工厂分拣。
          </p>
          <div style={{marginTop:16,padding:12,borderRadius:12,background:'var(--bg-1)',border:'1px solid var(--line)'}}>
            <div className="optlabel">当前选择</div>
            <div style={{fontFamily:'IBM Plex Mono',fontSize:13,color:'var(--ink)',marginTop:6}}>
              size={String(size)}x{size} · bead={bead} · 单价 ¥ {price} · 文件={file?file.name:'—'}
            </div>
          </div>
        </div>
      </div>

      {status==='done' && result && (
        <div id="result-anchor" className="results">
          <div className="card reveal">
            <h2><span className="n">03</span> 像素预览</h2>
            <div className="actions">
              <button className="btn primary" onClick={function(){downloadBlob(result.pdf_b64, '拼豆图纸_'+size+'_'+bead+'.pdf', 'application/pdf');}}>⬇ 下载 PDF 图纸</button>
            </div>
            <div className="gridframe">
              <img src={'data:image/png;base64,'+result.grid_b64} alt="拼豆网格预览" />
            </div>
            <div className="gridcap">{size}x{size} · {bead} · 共 {sorted.length} 种颜色</div>
          </div>

          <div className="card reveal">
            <h2><span className="n">04</span> 色卡清单 BOM</h2>
            <div className="statrow">
              <div className="stat"><div className="k">豆子总数</div><div className="v">{total.toLocaleString()}<small> 颗</small></div></div>
              <div className="stat"><div className="k">颜色种数</div><div className="v">{sorted.length}</div></div>
              <div className="stat"><div className="k">预估价</div><div className="v">¥ {price}</div></div>
            </div>
            {sorted.length ? (
              <table className="bom">
                <thead><tr><th>颜色</th><th style={{textAlign:'right'}}>颗数</th><th style={{textAlign:'right'}}>%</th></tr></thead>
                <tbody>
                  {sorted.map(function(x){return (
                    <tr key={x.id}>
                      <td><span className="namecol">
                        <span className="swatch" style={{background:x.hex}}></span>
                        <><span className="nm">{x.name}</span> <span className="idc">#{x.id}</span></>
                      </span></td>
                      <td className="cnt">{x.count.toLocaleString()}</td>
                      <td className="pct">{(100*x.count/total).toFixed(1)}%</td>
                    </tr>
                  );})}
                </tbody>
              </table>
            ) : <div className="empty">暂无色卡数据</div>}
          </div>
        </div>
      )}

      <footer>
        后端接口 <code>POST /api/process</code> · 返回 <code>{'{pdf_b64, grid_b64, bom}'}</code> ·
        配置接口 <code>GET /api/config</code> · 算法:双边滤波降噪 -> K-Means 预降色 -> CIELAB 匹配实体色卡 -> 稀有色合并
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
